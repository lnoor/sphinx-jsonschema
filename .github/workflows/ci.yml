name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same pull request supersedes the run that is still in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      - run: tox -e lint

  test:
    name: test (${{ matrix.tox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.11"
            tox: py311
          - python: "3.12"
            tox: py312
          - python: "3.13"
            tox: py313
          - python: "3.14"
            tox: py314
          - python: "3.15"
            tox: py315
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install tox
      # tox enforces the coverage threshold (--cov-fail-under in tox.ini) as well
      - run: tox -e ${{ matrix.tox }}

  verify-demo:
    name: verify-demo
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install tox
      # the demo build fails on any Sphinx warning
      - run: tox -e demo-html
