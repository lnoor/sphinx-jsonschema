[tox]
# Sphinx 9.1.0 requires Python >= 3.12
# Sphinx 9.0.0 requires Python >= 3.11
# last Sphinx 8.x.x release also requires Python >= 3.11
envlist = py311, py312, lint
skip_missing_interpreters = true

[testenv]
usedevelop = True
deps =
    pytest
    pytest-cov
    sphinx
    docutils
    requests
    jsonpointer
    pyyaml
commands =
    pip3 freeze
    pytest -rs {posargs} --cov=sphinx-jsonschema --cov-report=term-missing --cov-report=html --cov-fail-under=85

[demo]
deps =
    sphinx
    docutils
    requests
    jsonpointer
    pyyaml

[testenv:demo-html]
description = Build the demo document as HTML into demo/_build/html
usedevelop = True
deps = {[demo]deps}
commands =
    sphinx-build -b html {posargs} demo demo/_build/html

[testenv:demo-latex]
description = Build the demo document as LaTeX sources into demo/_build/latex
usedevelop = True
deps = {[demo]deps}
commands =
    sphinx-build -b latex {posargs} demo demo/_build/latex

[testenv:demo-pdf]
description = Build the demo document as HTML and as PDF (requires latexmk)
usedevelop = True
deps = {[demo]deps}
allowlist_externals = latexmk
commands =
    sphinx-build -b html {posargs} demo demo/_build/html
    sphinx-build -b latex {posargs} demo demo/_build/latex
    latexmk -pdf -interaction=nonstopmode -halt-on-error -outdir=demo/_build/latex demo/_build/latex/sphinx-jsonschema-demo.tex

[testenv:lint]
skip_install = true
usedevelop = false
deps = ruff
commands = ruff check {posargs:sphinx-jsonschema tests}
