# see https://docs.readthedocs.com/platform/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py

python:
  install:
    # the documentation uses the extension from this repository
    - method: pip
      path: .
    - requirements: docs/requirements.txt
